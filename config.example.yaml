# instant-news 設定ファイルのひな形。
# 本ファイルを config.yaml としてコピーし、各値を実行環境に合わせて設定してください。
#
# 本ファイルは 2 つの部分に分かれます。
#
# 【実行環境】server / database / media.storage_dir
#   常に本ファイルが真実です。設定を DB から読むためには先に DB へ繋ぐ必要があるため、その手前に要る値と、
#   コンテナの外で決まる値(画像の保存先は名前付きボリュームのマウント先と一致していなければ意味を成しません)
#   だけを置きます。
#
# 【初期値】discord / admin / articles / media.fetch / media.max_pixels / media.quota_bytes_per_user
#   初回起動時に MySQL の settings 表へ写され、以後は参照されません。真実は DB 側に移り、管理者は
#   フロントエンドの /admin から変更します。したがって、2 回目以降の起動で本ファイルのこれらの値を
#   書き換えても何も起きません。起動のたびに設定ファイルが DB を上書きする方式にすると、画面から変更した値が
#   次の再起動で黙って元へ戻るため、どちらが真実かを一方に決めています。
#
#   この部分は任意です。書かなかったキーは既定値(下記に併記)で埋まるため、実際に設定が要るのは
#   その環境でしか決まらない値、すなわち discord.guild_id と OAuth2・bot の資格情報だけです。
#   投入が済んだ後に、この部分を削除しても構いません。
#   設定が壊れて画面に入れなくなった場合(管理ロールの設定を誤った等)は、CLI から復旧できます:
#     python -m server.cli get-setting admin.role_ids
#     python -m server.cli set-setting admin.role_ids '["000000000000000000"]'

# --------------------------------------------------------------------------
# 実行環境。常に本ファイルが真実。
# --------------------------------------------------------------------------

server:
  host: 0.0.0.0
  port: 8000
  # 外部から到達可能な公開 URL。記事 URL・画像の絶対 URL・OAuth2 の戻り先の組み立てに用いる。
  # 逆プロキシを挟む構成では、上の host / port(待ち受け)ではなく、利用者のブラウザから見えるオリジンを書くこと。
  base_url: "http://localhost:8000"

database:
  host: db
  port: 3306
  name: instant_news
  user: instant_news
  password: "change-me"

media:
  # 画像の実体を置くディレクトリ。内容アドレスで保存する
  # ({hash[0:2]}/{hash[2:4]}/{hash}.{variant}.webp)。
  # コンテナのファイルシステムではなく Docker の名前付きボリュームを割り当てること。
  # イメージを入れ替えた瞬間に全画像が消える。
  # 設定として DB に置かないのは、この値がボリュームのマウント先と一体だからである。マウントを変えずに
  # この値だけを変えても画像は見つからず、変えた瞬間に既存の全画像が参照できなくなる。
  storage_dir: "/var/lib/instant-news/media"

  # 以下は初期値。真実は settings 表にある。
  # 記事の保存時に、本文中の画像 URL から画像を取得して取り込む。
  # 任意の URL をサーバーに取得させる機能であり SSRF そのものであるため、ループバック・
  # プライベート・リンクローカルの各 IP は拒否し、リダイレクトの各ホップで再検査する。
  fetch:
    # 1 記事の保存あたりに取得を試みる画像の最大数。超過分は元の URL のまま残す。既定 20、0 以上。
    # 0 なら取り込まない。
    max_images_per_article: 20
    # 1 枚あたりの最大バイト数。Content-Length は信用せず、ストリームしながら超過で中断する。
    # 既定 10485760(10 MiB)、1 以上。
    max_bytes: 10485760
    # 1 枚あたりの取得のタイムアウト(秒)。既定 10、0 より大きい値。
    # 0 は許さない。取り込まないことを表すなら max_images_per_article を 0 にすること。
    timeout_seconds: 10
    # 1 記事の保存あたりの取得の総所要時間の上限(秒)。超過したものは失敗として扱う。
    # 既定 60、0 より大きい値。
    total_timeout_seconds: 60
    # リダイレクトを追う最大ホップ数。各ホップで宛先 IP を再検査する。既定 3、0〜10。
    max_redirects: 3
  # デコード後の最大画素数。展開爆弾(数 KB の PNG が展開時に数十 GB の画素になる)への対策。
  # バイト数ではなく画素数で上限を設ける必要がある。既定 50000000、1 以上。
  max_pixels: 50000000
  # 1 ユーザーが取り込める画像の合計バイト数の上限(原寸版の合計)。既定 1073741824(1 GiB)、0 以上。
  quota_bytes_per_user: 1073741824

# --------------------------------------------------------------------------
# 初期値。初回起動時に settings 表へ写され、以後は参照されない。
# --------------------------------------------------------------------------

discord:
  # 対象とする単一 Discord サーバー(guild)の ID。閲覧制限(ロール限定公開)や members 公開の
  # 判定に用いるため必須。この 1 つのサーバーのメンバーとロールがユーザー管理の基盤となる。
  # 設定画面には表示されるが変更できない。変更すると、ロールのスナップショット・報道社のロール紐付け・
  # 閲覧範囲の判定がすべて別の guild を指すことになり、既存のデータが無意味になる。
  # 他の guild へ移すのは再デプロイであって設定変更ではない。
  guild_id: "000000000000000000"
  # 利用者認証(OAuth2)に用いるアプリケーション資格情報。
  # 必要なスコープは identify(ユーザー識別)と guilds.members.read(guild 内のロール取得)。
  # 認可後に戻る URL は設定として持たない。server.base_url と、戻り先を受け取る経路 /auth/callback から
  # 導出する(上記の base_url なら http://localhost:8000/auth/callback)。
  # この導出結果を Discord のアプリケーション設定の Redirects へ登録すること。
  oauth:
    client_id: "000000000000000000"
    client_secret: "change-me"
  # 新着記事を通知する bot の設定。
  # 新着記事の通知先は、記事のカテゴリ(categories.notify_channel_id)とタグ(tags.notify_channel_id)を
  # 重複排除した集合として解決する。宛先が 0 件の記事はどこにも通知しない。既定チャンネルへの
  # フォールバックは持たない(「この欄は通知しない」という意図を表現できなくなるため)。
  bot:
    # 変更すると bot の再接続が要る。設定画面はその旨を示す。
    token: "change-me"
    # 公開待ちの記事を拾い、予約公開の時刻到来を判定する間隔(秒)。既定 15、1〜3600。
    # ここだけが「見に行く」間隔である。公開を決めるのは server であり、Discord はそれを知らないため、
    # 待ち行列を周期的に見に行くしかない。以下の 2 つの照合の間隔は、Discord から届くイベントを取りこぼした
    # 場合にそれが正されるまでの上限であって、反映の速さを決める設定ではない。
    publish_poll_interval_seconds: 15
    # guild のロール・メンバー・オーナーを Discord と突き合わせて補正する間隔(秒)。既定 3600、1〜3600。
    # ロールの変更はこの間隔を待たずにイベントで即座に反映される。上限があるのは安全のため。
    # 管理者の資格とロール別の閲覧範囲は、bot が書き込むスナップショットに基づいて要求のたびに判定される。
    # イベントは取りこぼしうる(bot の停止中や、その処理が失敗したとき)ため、必ず補正される時刻の上限が要る。
    guild_reconcile_interval_seconds: 3600
    # 投票の数とコメントを Discord と突き合わせて補正する間隔(秒)。既定 3600、1〜86400。
    count_reconcile_interval_seconds: 3600
    # 投票の数とコメントを照合し直す、公開からの日数。既定 14、0〜365。
    # 照合は対象期間の通知とスレッドを 1 件残らず読み直すため、際限なく遡ると、反応がとうに止んだ記事まで含めて問い合わせが増え続ける。
    # ここを過ぎた通知にもイベントは届き、投票もコメントもそのまま更新される(イベントが読むのは実際に変化した投稿だけである)。
    # スレッドを開けなかった・投票用の絵文字を付けられなかった通知を拾い直す期間も兼ねる。0 にするとその再試行も止まる。
    count_reconcile_window_days: 14

# プラットフォーム管理用の API キー(ads:admin / taxonomy:admin / settings:admin / articles:write:any)を
# 発行できる資格の判定。既定では Discord の Administrator 権限保有者と guild オーナーが該当する。
# Administrator はサーバーの全操作を許す極めて強い権限であり、広告を入稿させたいだけの相手に
# 与えるのは筋が悪い。ここに管理ロールを列挙すると、Administrator を配らずに「編集長」「広告担当」
# といったロールへプラットフォーム管理を委譲できる。
# guild オーナーは bot がイベント(オーナーの移譲)と照合で users.is_guild_owner として取り込むため、設定には現れない。
# 既定は空。
admin:
  role_ids: []

articles:
  # 速報。通知時にロールを mention する。
  breaking:
    # 速報フラグを立てられるロール。空なら誰も立てられない(記事は通常記事として出る)。
    # 乱発を防ぐため、付与できる相手を絞る。既定は空。
    allowed_role_ids: []
    # 通知時に mention するロール。空なら mention しない。既定は空。
    mention_role_ids: []
  # API キー 1 本あたりの記事の作成・更新の上限(1 時間あたり)。超過したキーには 429 を返す。
  # 自動投稿は本質的に暴走しうるため、キー単位で上限を設ける。既定 60、0 以上。
  api_rate_limit_per_hour: 60
