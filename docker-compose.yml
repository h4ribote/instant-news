# instant-news の実行環境。db(MySQL)・server(FastAPI)・bot(Discord bot)の 3 サービスで構成する。
#
# 状態を持つ場所は MySQL だけではない。この構成が永続化する状態は次の 2 つであり、両者は互いを参照する:
#   db-data     … MySQL のデータ。記事・利用者・画像の登録簿(media 表)。
#   media-data  … 画像の実体。media 表の各行が content_hash で指す先(config.yaml の media.storage_dir)。
# したがってバックアップと復元は必ず 2 つを揃えて行う。MySQL だけを戻すと、記事は画像を指しているのに実体が無い状態になり、media 表だけを消すと実体が誰からも参照されないまま残る。画像をボリュームではなくコンテナのファイルシステムに置くと、イメージを入れ替えた瞬間に全画像が消え、DB 側の参照だけが残る。
#
# ビルドコンテキストは server・bot とも、各サービスのディレクトリではなくリポジトリのルートである。両者は common/ を共有しており、コンテキストを絞ると common/ をコピーできない。
#
# config.yaml は Git 追跡対象外であり、イメージにも焼き込まない(.dockerignore で除外している)。実行時にマウントで渡すため、設定を変えてもイメージの再ビルドは要らない。common/config.py はリポジトリのルート、すなわちコンテナ内の /app にある config.yaml を探すため、そこへ重ねる。
#
# compose は YAML の設定ファイルを読めないため、DB の資格情報と公開ポートだけは config.yaml と二重に現れる。値はリポジトリのルートに置く .env(Git 追跡対象外にすること)で与え、config.yaml の対応する値と一致させる。

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      # スキーマは utf8mb4 で作られる(migrations/0001_initial.sql)。MySQL 8 の既定と同じだが、絵文字と多言語を扱う前提が既定値に依存しないよう明示する。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # articles の全文検索は ngram パーサを使う(日本語は空白で語を区切らないため、既定の空白区切りでは索引が成立しない)。ngram_token_size は起動時にしか設定できず、この値で索引が構築されるため、後から変える場合は FULLTEXT 索引の作り直しが要る。2 は 2 文字の語から拾える既定値。
      - --ngram-token-size=2
    environment:
      # config.yaml の database 節と一致させること。パスワードには既定値を持たせない。リポジトリに既定の資格情報を置くと、変更されないまま本番へ出る。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-instant_news}
      MYSQL_USER: ${MYSQL_USER:-instant_news}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?config.yaml の database.password と同じ値を .env の MYSQL_PASSWORD に設定してください}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MySQL の root パスワードを .env の MYSQL_ROOT_PASSWORD に設定してください(アプリケーションは root を使わず、保守用です)}
    volumes:
      - db-data:/var/lib/mysql
      # データディレクトリが空のとき、すなわち初回起動時にのみ実行され、スキーマを作る。既存のデータがある環境では実行されないため、スキーマ変更を反映する手段にはならない。
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 を明示して TCP で確かめる(localhost では UNIX ソケットに繋いでしまい、初期化中の一時サーバーにも繋がってしまう)。初期化中の MySQL はネットワークを無効にした一時サーバーで動くため、TCP で繋がること自体が初期化の完了を意味する。さらにアプリと同じ資格情報で対象のデータベースへ問い合わせ、利用者とスキーマまで揃ったことを確かめる。
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      # スキーマの初期化が終わるまでは失敗して当然であり、その間の失敗を unhealthy と数えさせない。
      start_period: 60s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # スキーマの初期化が終わるまで起動を待つ。db のコンテナが立ち上がったことと、MySQL が接続を受けられることは別である。
        condition: service_healthy
    # 公開するのは config.yaml の server.port。compose は config.yaml を読めないため、既定値の 8000 から変える場合は config.yaml の server.port と .env の INSTANT_NEWS_PORT の両方を合わせること(コンテナの内と外で同じ番号を使う)。
    ports:
      - "${INSTANT_NEWS_PORT:-8000}:${INSTANT_NEWS_PORT:-8000}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # 画像の実体。マウント先は config.yaml の media.storage_dir と一致させること。
      - media-data:/var/lib/instant-news/media
    healthcheck:
      # 待ち受けポートは config.yaml が決めるため、ここでも設定から読む。トップページの配信までを確かめる。
      test: ["CMD", "python", "-c", "import urllib.request; from common.config import load_config; urllib.request.urlopen(f'http://127.0.0.1:{load_config().server.port}/', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # bot は server に依存しない。記事の公開を決めて通知を待ち行列へ積むのは server、待ち行列を読んで Discord へ送るのは bot であり、両者は DB の待ち行列(article_discord_posts / article_subscription_notices)だけで繋がる。server が落ちていても bot は積まれた分を送れ、bot が落ちていても server は公開して積める。
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    # 画像のボリュームは持たない。画像を書くのも配信するのも server である。

volumes:
  # MySQL のデータ。
  db-data:
  # 画像の実体。config.yaml の media.storage_dir に対応する。
  media-data:
